<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-label="Animated TNYPL lion shield logo">
<style>
#shield{stroke-dasharray:1700;stroke-dashoffset:1700;animation:drawShield 1.15s cubic-bezier(.2,.8,.2,1) forwards}
#innerShield{opacity:0;animation:fadeIn .55s .75s forwards}
#crown{opacity:0;transform-origin:380px 205px;transform:translateY(-55px) scale(.72);animation:crownDrop .72s .85s cubic-bezier(.16,1.25,.3,1) forwards}
#mane{opacity:0;transform-origin:360px 316px;transform:scale(.45) rotate(-12deg);animation:maneBuild .9s .48s cubic-bezier(.14,1.1,.25,1) forwards}
#face{opacity:0;transform-origin:360px 320px;transform:scale(.72);animation:faceIn .55s 1.05s cubic-bezier(.2,.9,.25,1) forwards}
#ballOrbit{opacity:0;animation:fadeIn .4s 1.35s forwards}
#ball{transform-origin:360px 331px;animation:orbit 6.5s 1.4s linear infinite}
#wordmark{opacity:0;transform:translateY(22px);animation:wordIn .65s 1.35s cubic-bezier(.2,.9,.25,1) forwards}
#logoCore{transform-origin:360px 385px;animation:logoBreath 4s 2.2s ease-in-out infinite}
@keyframes drawShield{to{stroke-dashoffset:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes crownDrop{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes maneBuild{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes faceIn{to{opacity:1;transform:scale(1)}}
@keyframes wordIn{to{opacity:1;transform:translateY(0)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes logoBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}#shield{stroke-dashoffset:0}#innerShield,#crown,#mane,#face,#ballOrbit,#wordmark{opacity:1;transform:none}}
</style>

  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f69"/>
      <stop offset=".56" stop-color="#071a3a"/>
      <stop offset="1" stop-color="#020a19"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset=".45" stop-color="#f6c64e"/>
      <stop offset="1" stop-color="#c9820b"/>
    </linearGradient>
    <linearGradient id="redFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef3d52"/>
      <stop offset="1" stop-color="#991329"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".36"/>
    </filter>
    <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wordReveal"><rect id="wordClip" x="72" y="583" width="576" height="142" rx="10"/></clipPath>
  </defs>
  <g id="logoCore" filter="url(#softShadow)">
    <path id="shield" d="M360 48 619 139v194c0 178-94 314-259 399C195 647 101 511 101 333V139z"
      fill="url(#shieldFill)" stroke="url(#goldFill)" stroke-width="18"/>
    <path id="innerShield" d="M360 80 585 159v170c0 151-77 267-225 346-148-79-225-195-225-346V159z"
      fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="4"/>

    <g id="crown">
      <path d="M246 209 284 153l58 43 38-80 39 80 58-43 37 56-25 27H271z" fill="url(#goldFill)"/>
      <circle cx="284" cy="151" r="8" fill="#fff7ca"/>
      <circle cx="380" cy="112" r="8" fill="#fff7ca"/>
      <circle cx="477" cy="151" r="8" fill="#fff7ca"/>
    </g>

    <g id="mane">
      <path d="M360 182 422 203 471 249 491 314 476 380 429 429 360 449 291 429 244 380 229 314 249 249 298 203z"
        fill="url(#goldFill)"/>
      <path d="M360 199 408 217 448 255 465 312 452 366 412 407 360 423 308 407 268 366 255 312 272 255 312 217z"
        fill="#d99b1d" opacity=".48"/>
      <path d="M360 181 384 238 336 238z" fill="#fff1a8" opacity=".62"/>
      <path d="M468 251 423 276 411 231z" fill="#ffd96d" opacity=".38"/>
      <path d="M472 379 414 364 445 327z" fill="#b96c07" opacity=".35"/>
      <path d="M360 449 337 392 384 392z" fill="#b96c07" opacity=".38"/>
      <path d="M248 379 306 364 275 327z" fill="#fff1a8" opacity=".28"/>
      <path d="M249 251 296 276 308 231z" fill="#b96c07" opacity=".30"/>
    </g>

    <g id="face">
      <path d="M289 276c0-56 31-94 71-94s71 38 71 94v83c0 52-31 91-71 91s-71-39-71-91z" fill="#071a3a"/>
      <path d="M303 282c16-17 35-22 57-14-19 8-34 21-44 39-7-7-11-15-13-25z" fill="#f6c64e"/>
      <path d="M417 282c-16-17-35-22-57-14 19 8 34 21 44 39 7-7 11-15 13-25z" fill="#f6c64e"/>
      <path d="M337 342c16-12 31-12 46 0-7 14-15 21-23 21s-16-7-23-21z" fill="#fff1a8"/>
      <path d="M324 385c23 16 49 16 72 0-3 37-69 37-72 0z" fill="#f6c64e"/>
      <path d="M315 412c26 18 64 18 90 0-8 25-24 39-45 39s-37-14-45-39z" fill="#020b1b"/>
    </g>

    <g id="ballOrbit">
      <ellipse cx="360" cy="331" rx="208" ry="122" fill="none" stroke="#f6c64e" stroke-opacity=".22" stroke-width="3" stroke-dasharray="8 15"/>
      <g id="ball">
        <circle cx="565" cy="331" r="24" fill="url(#redFill)" stroke="#fff" stroke-width="3"/>
        <path d="M552 313c13 10 21 23 24 38M558 309c13 10 21 23 24 38" fill="none" stroke="#fff" stroke-width="2.5"/>
      </g>
    </g>

    <g id="wordmark" clip-path="url(#wordReveal)">
      <text x="360" y="615" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="104" font-weight="900" letter-spacing="3" fill="#ffffff">TNYPL</text>
      <rect x="180" y="635" width="360" height="4" rx="2" fill="url(#goldFill)"/>
      <text x="360" y="678" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#f6c64e">YOUTH PREMIER LEAGUE</text>
      <text x="360" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#dce7f7">TAMIL NADU</text>
    </g>
  </g>

</svg>