[build]
  publish = "."

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"


# TNYPL automatic player-registration confirmation emails.
[functions."auto-registration-emails"]
  schedule = "* * * * *"

