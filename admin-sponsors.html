<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNYPL Sponsor Administration</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="v25.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body class="v25"><header class="v25-top"><div class="v25-shell"><a class="v25-brand" href="admin.html"><img src="tnypl-official-logo.png"><div><strong>SPONSOR ADMIN</strong><span>NO LEVELS ASSIGNED</span></div></a><nav class="v25-nav"><a href="admin.html">Admin</a><a href="sponsors.html" target="_blank">Public Sponsors</a><button id="logout">Logout</button></nav></div></header>
<main class="v25-shell"><section class="v25-hero"><small>TNYPL COMMERCIAL PARTNERS</small><h1>Partner control.</h1><p>Manage sponsor names, links, display order and visibility. Sponsor categories are intentionally left unassigned until commercial rights are finalized.</p></section><div id="spMsg" class="v25-panel" hidden></div>
<section class="v25-grid"><aside class="v25-panel"><h2>Edit Sponsor</h2><input type="hidden" id="spId"><div class="v25-field"><label>Name</label><input id="spName"></div><div class="v25-field"><label>Logo file path</label><input id="spLogo"></div><div class="v25-field"><label>Website URL</label><input id="spUrl"></div><div class="v25-field"><label>Display order</label><input id="spOrder" type="number" value="100"></div><div class="v25-field"><label>Sponsor level</label><input id="spLevel" placeholder="Leave blank for now"></div><div class="v25-field"><label>Active</label><select id="spActive"><option value="true">Yes</option><option value="false">No</option></select></div><button class="v25-button" id="saveSponsor">SAVE SPONSOR</button><button class="v25-button blue" id="clearSponsor" style="margin-top:8px">CLEAR FORM</button></aside><section class="v25-panel"><h2>Current Sponsors</h2><div id="adminSponsorRows"></div></section></section></main><script src="admin-sponsors.js"></script></body></html>
