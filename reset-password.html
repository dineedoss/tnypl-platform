<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password | TNYPL</title><link rel="stylesheet" href="styles.css"></head>
<body class="portal-body"><main class="portal-login-shell"><section class="portal-login-brand"><img src="tnypl-crest.png" alt="TNYPL"><h1>New<br>Password</h1></section>
<section class="portal-login-card"><small>SECURE ACCOUNT UPDATE</small><h2>Choose Password</h2><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="8" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="8" required></label><button class="btn btn-gold full">Update Password</button><div id="resetMessage"></div></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(TNYPL_CONFIG.SUPABASE_URL,TNYPL_CONFIG.SUPABASE_ANON_KEY);
resetForm.onsubmit=async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value){resetMessage.textContent="Passwords do not match.";return}const {error}=await sb.auth.updateUser({password:newPassword.value});resetMessage.textContent=error?error.message:"Password updated. You can now sign in.";if(!error)setTimeout(()=>location.href="owner-login.html",1500)};
</script></body></html>
