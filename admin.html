<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TNYPL Admin Operations</title><link rel="stylesheet" href="styles.css"></head>
<body class="admin-body"><header class="owner-portal-header"><a href="index.html"><img src="tnypl-wordmark.svg" alt="TNYPL"></a><div><a href="commissioner.html">Commissioner</a><a href="tournament-centre.html">Tournament Centre</a><button id="logoutBtn">Logout</button></div></header>
<main class="shell admin-main">
<section id="loginPanel" class="portal-login-card admin-login"><small>AUTHORIZED STAFF</small><h2>Admin Login</h2><form id="loginForm"><label>Email<input type="email" id="adminEmail" required></label><label>Password<input type="password" id="adminPassword" required></label><button class="btn btn-gold full">Login</button><div id="loginMessage"></div></form></section>
<section id="dashboard" hidden>
<div class="admin-title"><div><p class="eyebrow dark">TNYPL OPERATIONS CENTRE</p><h1>Player Registration & Draft Admin</h1></div><div class="admin-status-controls"><select id="leagueStatus"><option>Registration Open</option><option>Registration Closed</option><option>Verification</option><option>Draft Day</option><option>Tournament Live</option><option>Completed</option></select><button id="saveLeagueStatus" class="btn btn-dark">Update Status</button></div></div>
<div class="admin-stat-grid"><article><span>Total</span><strong id="totalCount">0</strong></article><article><span>Pending</span><strong id="pendingCount">0</strong></article><article><span>Verified</span><strong id="verifiedCount">0</strong></article><article><span>Draft Eligible</span><strong id="eligibleCount">0</strong></article><article><span>Drafted</span><strong id="draftedCountAdmin">0</strong></article><article><span>Refund Eligible</span><strong id="refundCount">0</strong></article></div>
<div class="admin-toolbar"><input id="searchInput" placeholder="Search player, district, role or reference"><select id="statusFilter"><option value="">All statuses</option><option value="pending">Pending</option><option value="changes_requested">Changes Requested</option><option value="verified">Verified</option><option value="rejected">Rejected</option></select><select id="categoryFilter"><option value="">All categories</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option></select><button id="exportBtn" class="btn btn-gold">Export Master CSV</button><button id="draftExportBtn" class="btn btn-dark">Export Draft Pool</button></div>
<div class="table-scroll admin-table-wrap"><table class="admin-table"><thead><tr><th>Player</th><th>Photo</th><th>DOB / District</th><th>Role</th><th>Payment</th><th>Age</th><th>Category / Points</th><th>Draft Status</th><th>Actions</th></tr></thead><tbody id="playersBody"></tbody></table></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
