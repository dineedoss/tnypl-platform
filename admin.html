<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TNYPL Admin</title><link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="v26-polish.css"><script src="public-safe.js"></script></head>
<body>
<header style="background:#04142f;color:white;padding:28px 5vw;display:flex;justify-content:space-between;align-items:center">
<div><small style="color:#f0b53a;letter-spacing:.14em;font-weight:900">TNYPL CONTROL ROOM</small><h1 style="font-family:'Barlow Condensed';font-size:3rem;margin:5px 0">ADMIN DASHBOARD</h1></div>
<div><a class="button outline" href="index.html">View Site</a> <button id="logoutBtn" class="button gold">Logout</button></div>
</header>
<main style="width:min(1250px,calc(100% - 40px));margin:40px auto">
<section id="loginPanel" style="max-width:460px;margin:50px auto;background:white;padding:30px;border-radius:18px">
<h2>Administrator Login</h2>
<form id="loginForm" style="display:grid;gap:16px">
<label>Email<input type="email" id="adminEmail" required style="width:100%;padding:12px"></label>
<label>Password<input type="password" id="adminPassword" required style="width:100%;padding:12px"></label>
<button class="button gold">Login</button><div id="loginMessage"></div>
</form></section>
<section id="dashboard" hidden>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px">
<article style="background:white;padding:22px;border-radius:16px"><span>Total registrations</span><strong id="totalCount" style="display:block;font-size:3rem">0</strong></article>
<article style="background:white;padding:22px;border-radius:16px"><span>Payment verified</span><strong id="paymentCount" style="display:block;font-size:3rem">0</strong></article>
<article style="background:white;padding:22px;border-radius:16px"><span>Age verified</span><strong id="ageCount" style="display:block;font-size:3rem">0</strong></article>
<article style="background:white;padding:22px;border-radius:16px"><span>Draft eligible</span><strong id="eligibleCount" style="display:block;font-size:3rem">0</strong></article>
</div>
<div style="display:flex;gap:12px;margin:24px 0"><input id="searchInput" placeholder="Search name, district or role" style="flex:1;padding:12px"><select id="statusFilter" style="padding:12px"><option value="">All statuses</option><option value="pending">Pending</option><option value="eligible">Eligible</option><option value="rejected">Rejected</option><option value="drafted">Drafted</option></select><button id="exportBtn" class="button gold">Export CSV</button></div>
<div style="overflow:auto;background:white;border-radius:16px"><table style="width:100%;border-collapse:collapse;min-width:1500px"><thead><tr><th>Player</th><th>DOB</th><th>District</th><th>Role</th><th>CricHeroes</th><th>Attachments</th><th>Payment</th><th>Age</th><th>Status</th><th>Franchise</th><th>Actions</th></tr></thead><tbody id="playersBody"></tbody></table></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
<div style="position:fixed;right:14px;bottom:14px;z-index:50"><a href="admin-match-center.html" style="display:inline-block;padding:11px 15px;border-radius:999px;background:#d9ad43;color:#06132a;text-decoration:none;font-family:Arial;font-weight:900">MATCH CENTER ADMIN</a></div><div style="position:fixed;left:14px;bottom:14px;z-index:60"><a href="official-draw-admin.html" style="display:inline-block;padding:11px 15px;border-radius:999px;background:#d9ad43;color:#06132a;text-decoration:none;font-family:Arial;font-weight:900">OFFICIAL DRAW</a></div><div style="position:fixed;right:14px;bottom:14px;z-index:100"><a href="commissioner-dashboard.html" style="display:inline-block;padding:12px 16px;background:#d9ad43;color:#06132a;border-radius:999px;text-decoration:none;font-family:Arial;font-weight:900">COMMISSIONER DASHBOARD</a></div></body></html>
