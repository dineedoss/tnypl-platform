<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNYPL Admin Team</title><link rel="stylesheet" href="styles.css"></head><body><header style="background:#04142f;color:#fff;padding:24px"><h1>Admin Team Management</h1><a href="admin.html" style="color:#d9ad43">← Admin Control Center</a></header><main style="max-width:1100px;margin:35px auto;padding:18px"><section style="background:#fff;padding:24px;border-radius:18px"><div id="teamMessage"></div><input id="memberId" type="hidden"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px"><label>Full name<input id="fullName"></label><label>Designation<input id="designation"></label><label>Department<input id="department"></label><label>Photo path/URL<input id="photoPath"></label><label>Location<input id="location"></label><label>Display order<input id="displayOrder" type="number" value="100"></label></div><label>Biography<textarea id="biography" rows="5"></textarea></label><label>Experience<textarea id="experience" rows="3"></textarea></label><label>Active<select id="isActive"><option value="true">Yes</option><option value="false">No</option></select></label><label>Featured<select id="isFeatured"><option value="false">No</option><option value="true">Yes</option></select></label><button id="saveMember" class="button gold">Save Member</button><button id="clearMember" class="button outline">Clear</button></section><section style="background:#fff;padding:24px;border-radius:18px;margin-top:20px"><h2>Current Team</h2><div id="teamRows"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin-team.js"></script></body></html>
