<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TNYPL Admin Auction Control Room</title><link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auction.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head><body class="auction-app">
<header class="auction-topbar"><div class="auction-shell">
<a class="auction-brand" href="admin.html"><img src="tnypl-official-logo.png"><div><strong>AUCTION CONTROL ROOM</strong><span>ADMIN OPERATIONS · TNYPL 2026</span></div></a>
<nav class="auction-nav"><a href="admin.html">Registrations</a><a href="draft-room.html" target="_blank">Public Screen</a><button id="adminAuctionLogout">Logout</button></nav>
</div></header>
<main class="auction-shell">
<div id="adminAuctionMessage" class="auction-alert" hidden></div>
<section class="admin-layout">
 <aside class="panel-card"><h3>Approved Players</h3><input id="adminPlayerSearch" class="control-input" placeholder="Search player"><div id="adminPlayerList" class="admin-list"></div></aside>
 <section>
  <div class="panel-card">
   <h3>Player Presentation</h3>
   <input type="hidden" id="adminSelectedPlayerId">
   <div class="form-row"><div><label class="control-label">Selected player</label><input id="adminSelectedName" class="control-input" readonly></div><div><label class="control-label">Category</label><select id="adminCategory" class="control-input"><option>Platinum</option><option>Gold</option><option>Silver</option></select></div></div>
   <div class="form-row"><div><label class="control-label">Base points</label><input id="adminBasePoints" class="control-input" type="number" value="300"></div><div><label class="control-label">Timer seconds</label><input id="adminTimerSeconds" class="control-input" type="number" value="45"></div></div>
   <div class="control-grid"><button class="btn-open" id="adminOpenAuction">OPEN AUCTION</button><button class="btn-pause" id="adminPauseAuction">PAUSE</button><button class="btn-sold" id="adminMarkSold">SOLD</button><button class="btn-unsold" id="adminMarkUnsold">UNSOLD</button></div>
  </div>
  <div class="panel-card" style="margin-top:18px"><h3>Current Auction</h3><div class="form-row"><div class="wallet-line total"><span>Player</span><strong id="adminCurrentPlayer">—</strong></div><div class="wallet-line total"><span>Highest bid</span><strong id="adminCurrentBid">—</strong></div></div><div class="form-row"><div class="wallet-line"><span>Leading franchise</span><strong id="adminCurrentLeader">—</strong></div><div class="wallet-line"><span>Status</span><strong id="adminCurrentStatus">—</strong></div></div></div>
  <div class="panel-card" style="margin-top:18px"><h3>Franchise Points & Settlement</h3><div class="table-wrap"><table class="auction-table"><thead><tr><th>Franchise</th><th>Allocated</th><th>Spent</th><th>Balance</th><th>Credit</th><th>Squad</th><th>Excess Payable</th><th>Lock</th></tr></thead><tbody id="adminWalletTable"></tbody></table></div><button class="auction-btn" id="adminGenerateSettlement" style="margin-top:15px">GENERATE SETTLEMENTS</button></div>
  <div class="panel-card" style="margin-top:18px"><h3>Accepted Bid Audit</h3><div id="adminBidHistory" class="bid-history"></div></div>
 </section>
</section></main><script src="auction-admin.js"></script></body></html>
