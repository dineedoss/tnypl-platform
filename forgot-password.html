<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Owner Password | TNYPL</title><link rel="stylesheet" href="styles.css"></head>
<body class="portal-body"><main class="portal-login-shell"><section class="portal-login-brand"><img src="tnypl-crest.png" alt="TNYPL"><h1>Reset<br>Password</h1><p>For franchise owner accounts.</p></section>
<section class="portal-login-card"><small>OWNER ACCOUNT RECOVERY</small><h2>Forgot Password</h2><form id="forgotForm"><label>Email<input id="forgotEmail" type="email" required></label><button class="btn btn-gold full">Send Reset Link</button><div id="forgotMessage"></div></form><p>Support: <a href="mailto:info@tnypl.in">info@tnypl.in</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(TNYPL_CONFIG.SUPABASE_URL,TNYPL_CONFIG.SUPABASE_ANON_KEY);
forgotForm.onsubmit=async e=>{e.preventDefault();forgotMessage.textContent="Sending…";const {error}=await sb.auth.resetPasswordForEmail(forgotEmail.value.trim(),{redirectTo:location.origin+"/reset-password.html"});forgotMessage.textContent=error?error.message:"Password reset link sent. Check your inbox."};
</script></body></html>
