<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNYPL DLS Calculator</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="v25.css"></head><body class="v25"><main class="v25-shell"><section class="v25-hero"><small>PROVISIONAL STANDARD EDITION AID</small><h1>DLS target<br>calculator.</h1><p>Enter official resource percentages supplied by the scorer or Standard Edition table.</p></section><section class="v25-panel"><div style="background:#4c3910;padding:12px;border-radius:9px">Confirm all targets with the official scorer, umpire or match referee. This does not reproduce the licensed Professional Edition.</div><div class="v25-grid"><div class="v25-field"><label>First innings score</label><input id="score" type="number" value="180"></div><div class="v25-field"><label>Team 1 resource used %</label><input id="r1" type="number" step=".1" value="100"></div><div class="v25-field"><label>Team 2 resource available %</label><input id="r2" type="number" step=".1" value="75"></div></div><button class="v25-button" id="calc" style="margin-top:14px">CALCULATE</button><h2 style="margin-top:20px">Par: <span id="par">—</span> · Target: <span id="target">—</span></h2></section></main><script>calc.onclick=()=>{const s=+score.value,a=+r1.value,b=+r2.value;if(a<=0||b<=0||s<0)return alert("Enter valid values");const p=Math.floor(s*b/a);par.textContent=p;target.textContent=p+1};calc.click()</script></body></html>
