<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNYPL Admin Match Center</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="v25.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body class="v25"><header class="v25-top"><div class="v25-shell"><a class="v25-brand" href="admin.html"><img src="tnypl-official-logo.png"><div><strong>ADMIN MATCH CENTER</strong><span>FIXTURES · SCORES · STREAMS</span></div></a><nav class="v25-nav"><a href="admin.html">Registrations</a><a href="admin-auction.html">Auction</a><a href="admin-sponsors.html">Sponsors</a><a href="match-center.html" target="_blank">Public</a><button id="logout">Logout</button></nav></div></header><main class="v25-shell"><section class="v25-hero"><small>COMMISSIONER OPERATIONS</small><h1>Match control.</h1></section><div id="mm" class="v25-panel" hidden></div><section class="v25-grid"><aside class="v25-panel"><h2 id="title">Create Fixture</h2><input type="hidden" id="id"><div class="v25-grid"><div class="v25-field"><label>Match Number</label><input id="number" readonly></div><div class="v25-field"><label>Match Day</label><input id="day" placeholder="Day 1"></div><div class="v25-field"><label>Date</label><input id="date" type="date"></div><div class="v25-field"><label>Start Time</label><input id="time" type="time"></div><div class="v25-field"><label>Format</label><select id="format"><option>T30</option><option>T20</option><option>T40</option><option>ODI</option><option>Other</option></select></div><div class="v25-field"><label>Status</label><select id="status"><option value="scheduled">Scheduled</option><option value="live">Live</option><option value="completed">Completed</option><option value="abandoned">Abandoned</option><option value="cancelled">Cancelled</option></select></div></div><div class="v25-field"><label>Venue</label><input id="venue"></div><div class="v25-field"><label>Ground</label><input id="ground"></div><div class="v25-field"><label>Google Maps URL</label><input id="map"></div><div class="v25-field"><label>Team A</label><select id="teamA"></select></div><div class="v25-field"><label>Team B</label><select id="teamB"></select></div><div class="v25-grid"><div class="v25-field"><label>Team A Score</label><input id="scoreA"></div><div class="v25-field"><label>Team B Score</label><input id="scoreB"></div></div><div class="v25-field"><label>Toss Winner</label><select id="toss"></select></div><div class="v25-field"><label>Toss Decision</label><select id="decision"><option value="">Pending</option><option>Bat</option><option>Bowl</option></select></div><div class="v25-field"><label>Result Type</label><select id="resultType"><option value="">Pending</option><option>Normal</option><option>Tie</option><option>Super Over</option><option>No Result</option><option>Abandoned</option></select></div><div class="v25-field"><label>Result Summary</label><input id="result"></div><div class="v25-field"><label>Winner</label><select id="winner"></select></div><div class="v25-field"><label>Player of Match</label><input id="pom"></div><div class="v25-grid"><div class="v25-field"><label>Umpire 1</label><input id="ump1"></div><div class="v25-field"><label>Umpire 2</label><input id="ump2"></div><div class="v25-field"><label>Third Umpire</label><input id="ump3"></div><div class="v25-field"><label>Match Referee</label><input id="referee"></div><div class="v25-field"><label>Scorer</label><input id="scorer"></div><div class="v25-field"><label>Weather</label><select id="weather"><option value="">Not set</option><option>Sunny</option><option>Cloudy</option><option>Rain Delay</option><option>Abandoned</option></select></div></div><div class="v25-field"><label>CricHeroes Scorecard URL</label><input id="cric"></div><div class="v25-field"><label>YouTube Live URL</label><input id="youtube"></div><div class="v25-field"><label>YouTube Replay URL</label><input id="replay"></div><div class="v25-grid"><div class="v25-field"><label>Stream Enabled</label><select id="stream"><option value="false">No</option><option value="true">Yes</option></select></div><div class="v25-field"><label>Published</label><select id="published"><option value="false">Draft</option><option value="true">Published</option></select></div></div><button class="v25-button" id="save">SAVE MATCH</button><button class="v25-button blue" id="clear" style="margin-top:8px">NEW MATCH</button></aside><section class="v25-panel"><h2>Fixtures & Results</h2><div id="rows"></div></section></section></main><script src="admin-match-v25.js"></script></body></html>
