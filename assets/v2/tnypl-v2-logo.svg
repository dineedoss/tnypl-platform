    <path d="M210 168h100l-13-30h-74zM221 138h78l-10-27h-58zM232 111h56l-8-25h-40zM244 86h32l-6-24h-20z"/>
    <path d="M205 168h110v38H205z"/>
    <path d="M226 168v38M248 168v38M272 168v38M294 168v38" opacity=".7"/>
  </g>
  <!-- crossed bats -->
