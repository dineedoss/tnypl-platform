    <path d="M166 238 327 414" stroke-width="26"/><path d="M354 238 193 414" stroke-width="26"/>
    <path d="M150 221 181 251M370 221 339 251" stroke-width="12"/>
  </g>
  <circle cx="340" cy="263" r="28" fill="#b52126" stroke="#f6d477" stroke-width="6"/>
