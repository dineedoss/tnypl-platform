  <path d="M135 455h250l-24 45H159z" fill="url(#g)" stroke="#6d470d" stroke-width="4"/>
  <text x="260" y="483" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="18" letter-spacing="2" fill="#06152a">YOUTH PREMIER LEAGUE</text>
  <text x="260" y="533" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16" letter-spacing="5" fill="#e8c05a">ESTD 2026</text>
