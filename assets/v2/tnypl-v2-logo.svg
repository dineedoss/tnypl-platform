<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" role="img" aria-labelledby="title desc">
<title id="title">TNYPL V2 crest</title><desc id="desc">Navy and gold shield with a temple, cricket bat and ball, and TNYPL lettering.</desc>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d878"/><stop offset=".42" stop-color="#d9a83e"/><stop offset="1" stop-color="#8e5f10"/></linearGradient>
  <linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12345f"/><stop offset="1" stop-color="#03142b"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<g filter="url(#shadow)">
  <path d="M260 18 465 92v188c0 137-82 252-205 314C137 532 55 417 55 280V92z" fill="url(#n)" stroke="url(#g)" stroke-width="14"/>
