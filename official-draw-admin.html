<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TNYPL Official Draw Control</title>
  <link rel="stylesheet" href="official-draw.css?v=R1.6">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    .draw-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:20px}
    .franchise-panel{background:#071a38;border-radius:16px;padding:18px}
    .franchise-grid{display:grid;grid-template-columns:1fr;gap:8px}
    .franchise-row{display:flex;align-items:center;justify-content:space-between;background:#03142d;border:1px solid rgba(255,255,255,.08);padding:10px 12px;border-radius:10px}
    .franchise-row span:last-child{font-size:.8rem;color:#d9ad43}
    .group-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .group-box{background:#03142d;padding:14px;border-radius:12px}
    .draw-status{margin:10px 0;color:#9fb1c8}
    @media(max-width:900px){.draw-layout{grid-template-columns:1fr}.group-columns{grid-template-columns:1fr}}
  .next-slot-box{display:inline-flex;align-items:center;gap:6px;background:#03142d;border:1px solid rgba(255,255,255,.12);padding:10px 14px;border-radius:9px;color:#fff}.next-slot-box strong{color:#d9ad43;font-size:1.15rem}</style>
</head>
<body>
<main>
  <a href="admin.html">Admin</a> ·
  <a href="official-draw-public.html" target="_blank">Public Draw</a>

  <h1>Official Draw Control</h1>
  <div id="drawMessage" hidden></div>

  <div class="draw-controls">
    <input id="drawName" value="TNYPL Season 1 Official Draw">
    <button id="createDraw">Create Draw</button>
    <button id="lockDraw" disabled>Lock Draw</button>

    <div class="next-slot-box">Next position: <strong id="nextSlot">A1</strong></div>

    <button id="spinWheel" disabled>Spin</button>
    <button id="acceptWinner" disabled>Accept</button>
    <button id="undoSpin" disabled>Undo</button>
    <button id="resetDraw" disabled>Reset</button>
  </div>

  <div class="draw-status" id="drawStatus">Loading latest draw…</div>

  <div class="draw-layout">
    <section>
      <canvas id="wheelCanvas" width="800" height="800"></canvas>
      <div id="winnerText">Loading the latest draw…</div>

      <section class="group-columns">
        <div class="group-box"><h2>Group A</h2><div id="groupA"></div></div>
        <div class="group-box"><h2>Group B</h2><div id="groupB"></div></div>
      </section>
    </section>

    <aside class="franchise-panel">
      <h2>Remaining Franchises</h2>
      <p id="franchiseSummary">No draw loaded.</p>
      <div id="allFranchises" class="franchise-grid"></div>
    </aside>
  </div>

  <section>
    <h2>Generate and Publish Schedule</h2>
    <input id="fixtureStartDate" type="date">
    <input id="fixtureVenue" placeholder="Venue">
    <input id="fixtureGround" placeholder="Ground">
    <input id="fixtureTime1" type="time" value="09:00">
    <input id="fixtureTime2" type="time" value="13:30">
    <button id="generateFixtures" disabled>Generate 15 Matches</button>
  </section>

  <button id="drawLogout">Logout</button>
</main>
<script src="official-draw-admin.js?v=R1.6.0"></script>
</body>
</html>
